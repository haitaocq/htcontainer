name: Build and Push Docker Images

on:
  # 1. main 分支代码变更（仅当 containers/** 路径有改动）
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'containers/**'
  # 2. Pull Request（仅验证可构建性，不推送）
  pull_request:
    branches: [ "main" ]
    paths:
      - 'containers/**'
  # 3. 手动触发：固定构建全部镜像
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 阶段 1：扫描变更的容器目录并生成动态构建矩阵
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Containers
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR：对比目标分支与当前提交，找出变更的容器目录
            CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^containers/' | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：固定构建全部镜像
            CHANGED_DIRS=$(find containers -maxdepth 2 -name Dockerfile | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            # 标签触发（v* 命名）：构建全部镜像
            CHANGED_DIRS=$(find containers -maxdepth 2 -name Dockerfile | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          else
            # main 分支 push：对比上次提交，找出变更的容器目录
            CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^containers/' | cut -d/ -f2 | sort -u | jq -R . | jq -s -c . || echo "[]")
          fi

          if [ "$CHANGED_DIRS" = "[]" ] || [ -z "$CHANGED_DIRS" ]; then
            CHANGED_DIRS=$(find containers -maxdepth 2 -name Dockerfile | cut -d/ -f2 | sort -u | jq -R . | jq -s -c .)
          fi

          echo "Detected changes in: $CHANGED_DIRS"
          echo "matrix=$CHANGED_DIRS" >> $GITHUB_OUTPUT

  # 阶段 2：并行构建并推送变动的镜像
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 此处已修正：使用 fromJSON 解析字符串数组
        container: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.container }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./containers/${{ matrix.container }}
          file: ./containers/${{ matrix.container }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.container }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container }}
