# agent_dsh Docker Compose 示例
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填入你的配置：
#        cp .env.example .env
#   2. 启动：
#        docker compose up -d
#   3. 访问 Web UI：http://localhost:3080
#
# 说明：
#   - 环境变量通过 ${VAR} 从 .env 读取，密钥不会写死在配置文件中
#   - 数据目录 dsh_data 与工作目录 dsh_workspace 使用具名卷持久化，
#     删除容器数据不丢失；如需挂载宿主目录改为绝对路径即可
#   - 容器内 agents 用户固定 uid/gid 10001。若改为宿主机目录 bind 挂载，
#     请确保该目录属主为 10001（chown -R 10001:10001 <host-dir>）
#   - 默认 DSH_CADDY=true：容器内置 Caddy 前置反向代理，dsh 内部仅绑定
#     127.0.0.1:3081。远程浏览器访问设置/模型页（settings.describe、
#     llm.discoverModels 等 loopback-only RPC）无需 DSH_TRUSTED_HOSTS
#   - 端口映射只暴露 ${DSH_PORT}（Caddy），dsh 内部端口 3081 不会对外

services:
  agent_dsh:
    image: ghcr.io/haitaocq/agent_dsh:latest
    container_name: agent_dsh
    restart: unless-stopped
    ports:
      - "${DSH_PORT:-3080}:${DSH_PORT:-3080}"
    volumes:
      - dsh_data:/home/agents/.dsh
      - dsh_workspace:/home/agents/workspace
    environment:
      # ---- dsh 基础配置 ----
      - DSH_HOME=/home/agents/.dsh
      - DSH_CADDY=${DSH_CADDY:-true}
      - DSH_PORT=${DSH_PORT:-3080}
      - DSH_UPSTREAM_PORT=${DSH_UPSTREAM_PORT:-3081}
      # DSH_BIND_HOST / DSH_TRUSTED_HOSTS 仅在 DSH_CADDY=false 直连模式下生效
      - DSH_BIND_HOST=${DSH_BIND_HOST:-0.0.0.0}
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
      - DSH_TOOLS_MODE=${DSH_TOOLS_MODE:-code}
      - DSH_WORKSPACE=/home/agents/workspace

      # ---- LLM 接入（两种方式任选其一，均在 .env 中配置）----
      # 方式一：DeepSeek 原生接入
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # 方式二：自定义 OpenAI 兼容 provider
      - DSH_PROVIDER_ID=${DSH_PROVIDER_ID:-custom-provider}
      - DSH_BASE_URL=${DSH_BASE_URL:-}
      - DSH_API_TOKEN=${DSH_API_TOKEN:-}
      - DSH_MODEL=${DSH_MODEL:-}
      - DSH_MODEL_DEFAULT=${DSH_MODEL_DEFAULT:-}

volumes:
  dsh_data:
  dsh_workspace:
